<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 160" role="img" aria-label="MIKO — on air">
  <!-- MIKO® wordmark. Constructed geometric caps; the O doubles as the ON AIR lamp. -->
  <g transform="translate(30,30)">
    <!-- M -->
    <polygon fill="#e6f2e6" points="0,0 28,0 56,48 84,0 112,0 112,100 86,100 86,42 65,76 47,76 26,42 26,100 0,100"/>
    <!-- I -->
    <rect fill="#e6f2e6" x="130" y="0" width="26" height="100"/>
    <!-- K -->
    <polygon fill="#e6f2e6" points="174,0 200,0 200,34 234,0 270,0 230,50 270,100 234,100 200,66 200,100 174,100"/>
    <!-- O = ring, slight optical overshoot past cap height -->
    <circle cx="333" cy="50" r="38.5" fill="none" stroke="#e6f2e6" stroke-width="26"/>
    <!-- signal dot -->
    <circle cx="333" cy="50" r="11.5" fill="#33ff66"/>
    <!-- ® -->
    <g transform="translate(404,4)" stroke="#e6f2e6" fill="none" stroke-width="1.6">
      <circle cx="6" cy="6" r="6.5"/>
      <path d="M3.8,9.5 V2.5 H6.6 a1.9,1.9 0 0 1 0,3.8 H3.8 M6.2,6.3 L8.6,9.5"/>
    </g>
  </g>
</svg>
